[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-sync"
dynamic = ["version"]
description = "Synchronize selected Agent Skills across devices and Agent clients"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "lijiaming" },
]
dependencies = []
keywords = ["agents", "skills", "codex", "claude", "kimi", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/lirt1231/skill-sync"
Documentation = "https://github.com/lirt1231/skill-sync#readme"
Issues = "https://github.com/lirt1231/skill-sync/issues"
Source = "https://github.com/lirt1231/skill-sync"
Changelog = "https://github.com/lirt1231/skill-sync/blob/main/CHANGELOG.md"

[project.scripts]
skill-sync = "skill_sync.cli:main"

[tool.setuptools.packages.find]
include = ["skill_sync*"]

[tool.setuptools.dynamic]
version = { attr = "skill_sync.version.__version__" }

[tool.setuptools.package-data]
skill_sync = ["web_static/*.html", "web_static/*.js", "web_static/*.css", "web_static/*.woff2"]
